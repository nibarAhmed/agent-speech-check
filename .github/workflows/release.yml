name: Release

# Pushing a tag like v1.2.3 releases that commit: the MSI, Linux tarballs, install.sh, and
# SHA256SUMS go on a GitHub Release. The winget manifests stay on the workflow run, for the
# winget-pkgs submission. The tag must equal the version in pyproject.toml, so bump that first
# (CONTRIBUTING.md, Releasing).
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history, so the next step can see whether main contains the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No cache: a release must not build from what an earlier run left behind.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check the tag is the package version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = uv version --short
          if ($env:TAG -cne "v$version") { throw "tag $env:TAG, but pyproject.toml has version $version" }
      # Only main's commits passed review and CI, so a tag on any other commit is refused.
      - name: Check main contains the tagged commit
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Install
        run: uv sync --locked
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build the MSI
        run: uv run python scripts/build_installer.py
      - name: Write the winget manifests
        run: uv run python -m scripts.winget_manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget
          path: dist/winget/*
          if-no-files-found: error

  linux:
    permissions:
      contents: read
    uses: $/.github/workflows/linux.yml

  github-release:
    # The build job checks the tag, so nothing is released without it.
    needs: [build, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Prepare installer and checksums
        run: |
          cp installer/install.sh assets/install.sh
          (cd assets && sha256sum -- *.msi *.tar.gz install.sh | LC_ALL=C sort -k2) > assets/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # gh publishes a release only after uploading every asset, so a failed run can leave a
        # draft, which a re-run finishes. A published release is already complete.
        run: |
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            gh release create "$TAG" assets/*.msi assets/*.tar.gz assets/install.sh assets/SHA256SUMS --verify-tag --title "$TAG" --generate-notes
          elif [ "$draft" = true ]; then
            gh release upload "$TAG" assets/*.msi assets/*.tar.gz assets/install.sh assets/SHA256SUMS --clobber
            gh release edit "$TAG" --draft=false
          else
            echo "$TAG is already released"
          fi

  # The release as a user's workflow gets it: this tag's action installs this tag's asc and
  # drives a real screen reader. A failure here means users can't set it up: fix it and release.
  try-windows:
    needs: github-release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: '"version=$($env:TAG.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'
      - uses: $/
        with:
          version: ${{ steps.tag.outputs.version }}
      # Without this, pwsh carries on past a failed asc command.
      - name: Use it
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          asc start --mode desktop
          asc launch notepad.exe --title Notepad
          asc press NVDA+T --expect "[0-9]"
      - if: always()
        run: asc stop

  try-linux:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # As in e2e.yml: Orca 51 or later.
    container:
      image: ubuntu:26.10@sha256:c4ca31b6e93261c5dd773826f789738a49e414ca04fc094b1ccd0f91e07329a2
      options: --init
    steps:
      - name: Install Orca and what asc runs with it
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            orca xvfb xdotool dbus-daemon libglib2.0-bin at-spi2-core openbox python3 \
            curl ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: $/
        with:
          version: ${{ steps.tag.outputs.version }}
      - name: Use it
        run: |
          asc start --mode desktop
          asc press NVDA+T --expect "[0-9]"
      - if: always()
        run: asc stop
