name: zizmor

# The online audits (known-vulnerable actions, impostor commits) need the job's token,
# which is safe here: this job runs none of the PR's code.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs the zizmor this action release pins by digest, so the action's pin is zizmor's.
      # Findings fail the job, like the other checks, instead of going to the Security tab.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
