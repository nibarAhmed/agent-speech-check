name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR code gets a read-only token, and checkout doesn't leave it on disk for that code.
permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the one used in development.
        python: ["3.12", "3.13"]
    name: check (${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Check (lint, types, dead code, deps, tests)
        run: uv run poe check

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Two builds of one version, as during development: the second must replace the first.
      - name: Build the MSI twice
        shell: pwsh
        run: |
          uv run python scripts/build_installer.py
          Copy-Item (Get-Item dist\agent-speech-check-*.msi).FullName "$env:RUNNER_TEMP\first.msi"
          uv run python scripts/build_installer.py
      - name: Install, upgrade, run and uninstall the MSI
        shell: pwsh
        run: |
          $first = "$env:RUNNER_TEMP\first.msi"
          $msi = (Get-Item dist\agent-speech-check-*.msi).FullName
          $dir = "$env:LOCALAPPDATA\Programs\agent-speech-check"
          $data = "$env:LOCALAPPDATA\agent-speech-check"
          $upgradeCode = '{45024D39-B418-4A36-B773-3A035735ECD7}'
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $logs = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\msi-logs"
          $script:run = 0
          function UserPath { [Environment]::GetEnvironmentVariable('Path', 'User') }
          # Its folders: Windows Installer drops an empty entry (a trailing ';') on uninstall.
          function PathFolders($path) { ($path -split ';' | Where-Object { $_ }) -join ';' }
          function Products { @($installer.RelatedProducts($upgradeCode)).Count }
          # Exit code 3010 (reboot needed) fails too: it means files were still in use.
          function Msiexec($arguments, $expected = 0) {
            $script:run++
            $p = Start-Process msiexec "$arguments /qn /l*v `"$logs\$script:run.log`"" -Wait -PassThru
            if ($p.ExitCode -ne $expected) { throw "msiexec $arguments exit $($p.ExitCode), expected $expected" }
          }
          # A watch-mode daemon from the installed asc, and its pid.
          function StartDaemon {
            & "$dir\asc.exe" start | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "asc start exit $LASTEXITCODE" }
            (Get-Content "$data\watch\state.json" | ConvertFrom-Json).pid
          }
          function AssertGone($daemon, $when) {
            if (Get-Process -Id $daemon -ErrorAction SilentlyContinue) { throw "daemon $daemon still running after $when" }
          }
          Msiexec "/i `"$msi`" ALLUSERS=1" 1603
          if ((Products) -ne 0) { throw "per-machine install was not refused" }
          $pathBefore = UserPath
          Msiexec "/i `"$first`""
          # An upgrade stops the daemon of the version it replaces.
          $daemon = StartDaemon
          Msiexec "/i `"$msi`""
          AssertGone $daemon 'upgrade'
          if ((Products) -ne 1) { throw "$(Products) products installed, expected 1" }
          if ((UserPath) -notlike "*$dir*") { throw "not on the user PATH" }
          if (-not (Test-Path "$data\watch\relay_cert.pem")) { throw "upgrade removed $data" }
          foreach ($flag in '--help', '--version') {
            & "$dir\asc.exe" $flag
            if ($LASTEXITCODE -ne 0) { throw "asc $flag exit $LASTEXITCODE" }
          }
          # An uninstall that fails at the end rolls back: asc and its state are back.
          $daemon = StartDaemon
          Msiexec "/x `"$msi`" WIXFAILWHENDEFERRED=1" 1603
          AssertGone $daemon 'a failed uninstall'
          if ((Products) -ne 1) { throw "a failed uninstall left $(Products) products" }
          if (-not (Test-Path "$dir\asc.exe")) { throw "a failed uninstall left no asc.exe" }
          if (-not (Test-Path "$data\watch\relay_cert.pem")) { throw "a failed uninstall removed $data" }
          # KEEPDATA=1 keeps the state.
          Msiexec "/x `"$msi`" KEEPDATA=1"
          if ((Products) -ne 0) { throw "$(Products) products left" }
          if (-not (Test-Path "$data\watch\relay_cert.pem")) { throw "KEEPDATA=1 removed $data" }
          # A plain uninstall stops the daemon and removes everything.
          Msiexec "/i `"$msi`""
          $daemon = StartDaemon
          Msiexec "/x `"$msi`""
          AssertGone $daemon 'uninstall'
          if ((Products) -ne 0) { throw "$(Products) products left" }
          if ((PathFolders (UserPath)) -cne (PathFolders $pathBefore)) { throw "user PATH changed`nbefore: $pathBefore`nafter:  $(UserPath)" }
          if (Test-Path $dir) { throw "$dir left behind" }
          if (Test-Path $data) { throw "$data left behind" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: dist/*.msi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi-logs
