name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR code gets a read-only token, and checkout doesn't keep it on disk.
permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the one used in development.
        python: ["3.12", "3.13"]
    name: check (${{ matrix.python }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Check (lint, types, dead code, deps, tests)
        run: uv run poe check

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Two builds of one version, as during development: the second must replace the first.
      - name: Build the MSI twice
        shell: pwsh
        run: |
          uv run python scripts/build_installer.py
          Copy-Item (Get-Item dist\agent-speech-check-*.msi).FullName "$env:RUNNER_TEMP\first.msi"
          uv run python scripts/build_installer.py
      - name: Install, upgrade, run and uninstall the MSI
        shell: pwsh
        run: |
          $first = "$env:RUNNER_TEMP\first.msi"
          $msi = (Get-Item dist\agent-speech-check-*.msi).FullName
          $dir = "$env:LOCALAPPDATA\Programs\agent-speech-check"
          $data = "$env:LOCALAPPDATA\agent-speech-check"
          $upgradeCode = '{45024D39-B418-4A36-B773-3A035735ECD7}'
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $logs = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\msi-logs"
          $script:run = 0
          function UserPath { [Environment]::GetEnvironmentVariable('Path', 'User') }
          # Its folders: Windows Installer drops an empty entry (a trailing ';') on uninstall.
          function PathFolders($path) { ($path -split ';' | Where-Object { $_ }) -join ';' }
          function Products { @($installer.RelatedProducts($upgradeCode)).Count }
          # Exit code 3010 (reboot needed) fails too: it means files were still in use.
          function Run($exe, $arguments, $expected = 0) {
            $script:run++
            $p = Start-Process $exe "$arguments /l*v `"$logs\$script:run.log`"" -Wait -PassThru
            if ($p.ExitCode -ne $expected) { throw "$exe $arguments exit $($p.ExitCode), expected $expected" }
          }
          function Msiexec($arguments, $expected = 0) { Run msiexec "$arguments /qn" $expected }
          # A watch-mode daemon from the installed asc, and its pid.
          function StartDaemon {
            & "$dir\asc.exe" start | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "asc start exit $LASTEXITCODE" }
            (Get-Content "$data\watch\state.json" | ConvertFrom-Json).pid
          }
          function AssertGone($daemon, $when) {
            if (Get-Process -Id $daemon -ErrorAction SilentlyContinue) { throw "daemon $daemon still running after $when" }
          }
          Msiexec "/i `"$msi`" ALLUSERS=1" 1603
          if ((Products) -ne 0) { throw "per-machine install was not refused" }
          $pathBefore = UserPath
          Msiexec "/i `"$first`""
          # An upgrade stops the daemon of the version it replaces.
          $daemon = StartDaemon
          Msiexec "/i `"$msi`""
          AssertGone $daemon 'upgrade'
          if ((Products) -ne 1) { throw "$(Products) products installed, expected 1" }
          if ((UserPath) -notlike "*$dir*") { throw "not on the user PATH" }
          if (-not (Test-Path "$data\watch\relay_cert.pem")) { throw "upgrade removed $data" }
          # The MSI's own entry is hidden, and ours points at the product the upgrade installed.
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $productCode = @($installer.RelatedProducts($upgradeCode))[0]
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $own = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\$sid\Products" |
            ForEach-Object { Get-ItemProperty "$($_.PSPath)\InstallProperties" -ErrorAction SilentlyContinue } |
            Where-Object { $_.UninstallString -like "*$productCode*" }
          if ($own.SystemComponent -ne 1) { throw "the MSI's own entry is not hidden" }
          $entry = Get-ItemProperty "$arp\agent-speech-check"
          if ($entry.UninstallString -ne "MsiExec.exe /I$productCode") { throw "UninstallString is $($entry.UninstallString)" }
          if ($entry.QuietUninstallString -ne "MsiExec.exe /X$productCode /qn") { throw "QuietUninstallString is $($entry.QuietUninstallString)" }
          foreach ($flag in '--help', '--version') {
            & "$dir\asc.exe" $flag
            if ($LASTEXITCODE -ne 0) { throw "asc $flag exit $LASTEXITCODE" }
          }
          # An uninstall that fails at the end rolls back: asc and its state are back.
          $daemon = StartDaemon
          Msiexec "/x `"$msi`" WIXFAILWHENDEFERRED=1" 1603
          AssertGone $daemon 'a failed uninstall'
          if ((Products) -ne 1) { throw "a failed uninstall left $(Products) products" }
          if (-not (Test-Path "$dir\asc.exe")) { throw "a failed uninstall left no asc.exe" }
          if (-not (Test-Path "$data\watch\relay_cert.pem")) { throw "a failed uninstall removed $data" }
          # KEEPDATA=1 keeps the state.
          Msiexec "/x `"$msi`" KEEPDATA=1"
          if ((Products) -ne 0) { throw "$(Products) products left" }
          if (-not (Test-Path "$data\watch\relay_cert.pem")) { throw "KEEPDATA=1 removed $data" }
          # A plain uninstall, run as winget runs it from our entry, stops the daemon and
          # removes everything.
          Msiexec "/i `"$msi`""
          $daemon = StartDaemon
          $exe, $quietArgs = (Get-ItemProperty "$arp\agent-speech-check").QuietUninstallString -split ' ', 2
          Run $exe $quietArgs
          AssertGone $daemon 'uninstall'
          if ((Products) -ne 0) { throw "$(Products) products left" }
          if ((PathFolders (UserPath)) -cne (PathFolders $pathBefore)) { throw "user PATH changed`nbefore: $pathBefore`nafter:  $(UserPath)" }
          if (Test-Path $dir) { throw "$dir left behind" }
          if (Test-Path $data) { throw "$data left behind" }
          if (Test-Path "$arp\agent-speech-check") { throw "the uninstall entry was left behind" }
      # The release's winget manifests, with the MSI served from here: its release URL
      # doesn't exist yet. Shows winget installs per user and finds our uninstall entry.
      - name: Install, list and uninstall with winget
        shell: pwsh
        run: |
          $flags = '--accept-source-agreements', '--disable-interactivity'
          function Check($what) { if ($LASTEXITCODE -ne 0) { throw "$what exit $LASTEXITCODE" } }
          uv run python -m scripts.winget_manifest
          Check 'winget_manifest'
          winget validate --manifest dist\winget --disable-interactivity
          Check 'winget validate'
          $msi = (Get-Item dist\agent-speech-check-*.msi).Name
          $manifest = "$env:RUNNER_TEMP\winget"
          Copy-Item -Recurse dist\winget $manifest
          $installer = Get-Item "$manifest\*.installer.yaml"
          (Get-Content $installer) -replace 'InstallerUrl: ".*"', "InstallerUrl: `"http://127.0.0.1:8765/$msi`"" |
            Set-Content $installer
          $server = Start-Process (Get-Command python).Source '-m http.server 8765 --bind 127.0.0.1 --directory dist' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-NetConnection 127.0.0.1 -Port 8765 -InformationLevel Quiet -WarningAction SilentlyContinue)) {
              if ((Get-Date) -gt $deadline) { throw 'the MSI server did not start' }
            }
            winget settings --enable LocalManifestFiles
            Check 'winget settings'
            winget install --manifest $manifest --silent --accept-package-agreements @flags
            Check 'winget install'
            $dir = "$env:LOCALAPPDATA\Programs\agent-speech-check"
            & "$dir\asc.exe" --version
            Check 'asc --version'
            # Once winget-pkgs has the package, winget may list it by its ID instead.
            $listed = @(winget list --name 'Agent Speech Check' --exact @flags |
              Select-String -Pattern 'nibarAhmed\.AgentSpeechCheck|ARP\\User\\X64\\agent-speech-check')
            if ($listed.Count -ne 1) { throw "winget lists $($listed.Count) entries, expected our one" }
            winget uninstall --name 'Agent Speech Check' --exact --silent @flags
            Check 'winget uninstall'
            if (Test-Path $dir) { throw "$dir left behind" }
            if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\agent-speech-check') {
              throw 'the uninstall entry was left behind'
            }
          } finally {
            # Quietly: if the server already exited, the error that ended the try is the one to see.
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: dist/*.msi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi-logs
