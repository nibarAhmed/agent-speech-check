name: Linux build

# The Linux tarballs, for e2e.yml's Orca tests and release.yml. Each uploads as linux-MACHINE.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.machine }})
    strategy:
      matrix:
        include:
          - machine: x86_64
            runner: ubuntu-latest
            # An old glibc (2.28): the app runs on the one it was built with and newer.
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
          - machine: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:34a5e614a4eb26f73f8bf44cbbf2acf8011620453d03ea35a58537bb3cde44de
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a release must not build from what an earlier run left behind.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked
      # By path: the install's own, on the glibc the tarball is built for. ci.yml runs the
      # rest on Linux, and e2e.yml the Orca tests.
      - name: The updater's Linux tests
        run: uv run pytest tests/unit/test_update.py tests/unit/test_uninstall.py tests/unit/test_build_installer.py -v -p no:cacheprovider
      - name: Build the tarball
        run: uv run python -m scripts.build_linux
      # As the README installs it, into an empty home, plus bad-checksum rejection and upgrade.
      - name: Install, upgrade, run and uninstall it
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          version=$(uv version --short)
          asset="agent-speech-check-linux-$MACHINE.tar.gz"
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          cp "dist/$asset" "$release/$asset"
          export HOME="$RUNNER_TEMP/home"

          # A tampered checksum must fail before creating anything.
          printf '%064d  %s\n' 0 "$asset" > "$release/SHA256SUMS"
          if ASC_RELEASE_URL="file://$release" sh installer/install.sh; then
            echo "install.sh accepted a bad SHA-256" >&2
            exit 1
          fi
          test ! -e "$HOME/.local/share/agent-speech-check"
          test ! -e "$HOME/.local/bin/asc"

          (cd "$release" && sha256sum -- "$asset") > "$release/SHA256SUMS"
          out=$(ASC_RELEASE_URL="file://$release" sh installer/install.sh)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq "is not on PATH"
          test "$("$HOME/.local/bin/asc" --version)" = "asc $version"
          "$HOME/.local/bin/asc" config set settle_ms 500

          # Reinstalling replaces cleanly and prunes older versions while keeping state.
          mkdir -p "$HOME/.local/share/agent-speech-check/versions/0.0.1"
          PATH="$HOME/.local/bin:$PATH" ASC_RELEASE_URL="file://$release" sh installer/install.sh
          test ! -e "$HOME/.local/share/agent-speech-check/versions/0.0.1"
          test "$(readlink "$HOME/.local/share/agent-speech-check/current")" = "versions/$version"
          test -f "$HOME/.local/state/agent-speech-check/config.toml"

          "$HOME/.local/bin/asc" uninstall --keep-data --yes
          test ! -e "$HOME/.local/share/agent-speech-check"
          test ! -L "$HOME/.local/bin/asc"
          test -f "$HOME/.local/state/agent-speech-check/config.toml"

          ASC_RELEASE_URL="file://$release" sh installer/install.sh
          "$HOME/.local/bin/asc" uninstall --yes
          test ! -e "$HOME/.local/share/agent-speech-check"
          test ! -L "$HOME/.local/bin/asc"
          test ! -e "$HOME/.local/state/agent-speech-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.machine }}
          path: dist/agent-speech-check-linux-${{ matrix.machine }}.tar.gz
          if-no-files-found: error
