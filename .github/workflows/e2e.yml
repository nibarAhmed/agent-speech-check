name: e2e

# The real-NVDA tests, on a hosted runner: a throwaway VM with no one's NVDA to
# replace, so the tests start a portable NVDA here, as they do in Windows Sandbox.
# The real-Orca tests, in a throwaway Linux container.
on:
  # Every PR, docs too: a required check skipped by a path filter never reports.
  pull_request:
  # Weekly too: asc downloads the latest NVDA, and the container the latest Orca, so
  # a new release can break it with no PR to run these. Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The tests run PR code, which must not find the token on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Create a portable NVDA
        shell: pwsh
        run: |
          $nvda = "$env:RUNNER_TEMP\nvda"
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\e2e-out"
          $installer = uv run python -c "from agent_speech_check.nvda import launcher as l; print(l.latest_installer())"
          if ($LASTEXITCODE -ne 0) { throw "download exit $LASTEXITCODE" }
          uv run python -c "import sys; from pathlib import Path; from agent_speech_check.nvda import launcher; launcher.create_portable(Path(sys.argv[1]), Path(sys.argv[2]))" $installer $nvda
          if ($LASTEXITCODE -ne 0) { throw "portable exit $LASTEXITCODE" }
          # The tests read these.
          "ASC_E2E_NVDA=$nvda" >> $env:GITHUB_ENV
          "ASC_E2E_OUT=$out" >> $env:GITHUB_ENV
          "ASC_E2E_INSTALLER=$installer" >> $env:GITHUB_ENV
      # A step timeout, under the job's, so a hang still fails here and uploads the log.
      - name: e2e tests
        timeout-minutes: 20
        run: uv run pytest -m e2e tests/e2e -v -p no:cacheprovider
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: ${{ runner.temp }}/e2e-out

  orca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A rolling distro, for Orca 51 or later. Its packages still come from today's repo.
    container: registry.opensuse.org/opensuse/tumbleweed@sha256:806c95a13322931c84d43f088aee444deb2f04affc2d82746e9625d8862c9872
    steps:
      - name: Install Orca and what asc runs with it
        run: >-
          zypper -n --gpg-auto-import-keys install --no-recommends
          orca xorg-x11-server-Xvfb xdotool dbus-1-daemon at-spi2-core openbox
          python3-gobject python3-gobject-Gdk typelib-1_0-Gtk-3_0 dejavu-fonts
          git-core tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      # By path: the other e2e and unit tests drive Windows.
      - name: Orca tests
        timeout-minutes: 10
        env:
          ASC_E2E_ORCA: "1"
        run: uv run pytest tests/unit/test_orca.py tests/e2e/test_real_orca.py -v -p no:cacheprovider
