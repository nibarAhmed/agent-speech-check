# Weekly, one PR per ecosystem (groups). Updates wait a week after a
# release (cooldown), so a compromised release is usually pulled before we take it. Security
# updates are not delayed by the cooldown, and groups apply only to version updates, so each
# security update still gets its own PR. The prefixes make Dependabot's PR titles
# conventional commits, which the pr-title check requires.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build

  # WiX, which builds the MSI (dotnet-tools.json).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      wix:
        patterns: ["*"]
    commit-message:
      prefix: build
