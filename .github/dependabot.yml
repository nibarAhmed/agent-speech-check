# GitHub's standard setup: weekly, one PR per update. Updates wait a week after a
# release (cooldown), so a compromised release is usually pulled before we take it. Security
# updates are not delayed by the cooldown. The prefixes make Dependabot's PR titles
# conventional commits, which the pr-title check requires.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  # WiX, which builds the MSI (dotnet-tools.json).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
