name: Bug report
description: asc did something wrong, crashed or fails sometimes.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        One problem per issue. Feature requests belong in
        [Discussions](https://github.com/nibarAhmed/agent-speech-check/discussions/categories/ideas).
        Leave out anything private: screen reader speech can contain passwords, messages or
        email, so check pasted output and logs first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed anything private from what I pasted.
          required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The asc commands, in order, and the app they ran against.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: asc's output, including any error, hint and exit code. The relevant part only.
      render: text
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - watch
        - desktop
        - shared
        - remote
        - not sure, or asc wasn't started
    validations:
      required: true
  - type: input
    id: asc-version
    attributes:
      label: asc version
      description: The output of `asc --version`.
    validations:
      required: true
  - type: input
    id: nvda-version
    attributes:
      label: Screen reader version (NVDA or Orca)
  - type: input
    id: windows-version
    attributes:
      label: OS version
      description: On Windows, run `winver`. On Linux, include your distro and release.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Anything you found that gets around it.
