name: Bug report
description: asc did something wrong or crashed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Leave out anything private. Screen reader speech can contain passwords, messages or email,
        so check pasted output and logs first.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The asc commands, in order, and the app they ran against.
      placeholder: |
        1. asc start --mode desktop
        2. asc press tab --expect "OK button"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: asc's output, including any error, hint and exit code.
      render: text
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - watch
        - desktop
        - shared
        - remote
        - not sure, or asc wasn't started
    validations:
      required: true
  - type: input
    id: asc-version
    attributes:
      label: asc version
      description: The output of `asc --version`.
      placeholder: asc 0.0.1
    validations:
      required: true
  - type: input
    id: nvda-version
    attributes:
      label: Screen reader version (NVDA or Orca)
      placeholder: "NVDA 2026.2 or Orca 51.1"
  - type: input
    id: windows-version
    attributes:
      label: OS version
      description: On Windows, run `winver`. On Linux, include your distro and release.
      placeholder: Windows 11 Pro 24H2 / Ubuntu 26.10
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - MSI installer (Windows)
        - Release tarball (Linux)
        - GitHub (uv tool install git+https://github.com/nibarAhmed/agent-speech-check)
        - a clone, with uv run
