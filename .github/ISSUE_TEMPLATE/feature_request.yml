name: Feature request
description: Something asc should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, and where asc gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: A command, option or output you'd like. Rough is fine.
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: Any workaround you use today.
