# One hook: the same gate as CI, `poe check` (see pyproject.toml), run through uv
# so every tool is the version pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: poe-check
        name: poe check
        entry: uv run --quiet poe check
        language: system
        pass_filenames: false
        always_run: true
