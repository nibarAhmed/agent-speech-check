# Every hook runs the tool version pinned in uv.lock, through uv.
repos:
  - repo: local
    hooks:
      - id: check-dashes
        name: no em dashes
        entry: uv run --quiet python scripts/check_dashes.py
        language: system
        types: [text]
      - id: codespell
        name: codespell
        entry: uv run --quiet codespell
        language: system
        types: [text]
        exclude: ^(docs/planning/|uv\.lock$)
      - id: ruff-format
        name: ruff format
        entry: uv run --quiet ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run --quiet ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --quiet mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: uv run --quiet vulture
        language: system
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: uv run --quiet deptry src
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
      - id: unit-tests
        name: unit tests
        entry: uv run --quiet pytest tests/unit -q --no-cov
        language: system
        pass_filenames: false
        types: [python]
