[project]
name = "agent-speech-check"
version = "0.0.1"
description = "Let AI agents test your app with a real NVDA: press keys, read what NVDA says, check it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nibarAhmed" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Adaptive Technologies",
]
dependencies = [
    "configobj>=5.0.9",
    "cryptography>=50.0.2",
    "psutil>=7.2.2",
    "tomlkit>=0.15.1",
]

[project.scripts]
asc = "agent_speech_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_speech_check"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "codespell",
    "deptry",
    "mypy",
    "poethepoet",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
    "ruff",
    "types-psutil>=7.2.2.20260906",
    "vulture",
]

# ---------------------------------------------------------------- tasks

[tool.poe.tasks]
dashes = "python scripts/check_dashes.py"
spell = "codespell"
fmt-check = "ruff format --check ."
lint = "ruff check ."
types = "mypy"
dead = "vulture"
deps = "deptry src"
test = "pytest -m 'not e2e' -n auto --maxprocesses 12 --dist loadgroup --cov=agent_speech_check --cov-report=term-missing:skip-covered --cov-fail-under=90"
unit = "pytest tests/unit -q -n 4 --dist loadgroup --no-cov -p no:cacheprovider"
check = ["dashes", "spell", "fmt-check", "lint", "types", "dead", "deps", "test"]

# A quicker gate than check. Runs every step even after a failure, so all problems
# are reported at once.
[tool.poe.tasks.fast]
sequence = ["dashes", "spell", "fmt-check", "lint", "types", "dead", "unit"]
ignore_fail = "return_non_zero"

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "BLE", "UP", "SIM", "C4", "PT", "RUF", "ASYNC",
    "PTH", "PL", "TRY", "ARG", "ERA", "S", "T20",
]

[tool.ruff.lint.per-file-ignores]
# cli.py is the only module allowed to print.
"src/agent_speech_check/cli.py" = ["T20"]
"tests/**" = ["S101", "PLR2004", "TRY003"]
# Dev scripts and hooks print and run tools on purpose.
"scripts/**" = ["T20", "S603", "S607"]
".claude/**" = ["T20", "S603", "S607"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
strict = true
files = ["src", "tests", "scripts/check_dashes.py", "scripts/build_installer.py"]
mypy_path = ["src", ".", "stubs"]
explicit_package_bases = true

# ---------------------------------------------------------------- vulture

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
# Used, but not in a way vulture can see.
ignore_names = [
    # HTMLParser calls these hooks (keyref.py).
    "handle_starttag", "handle_endtag", "handle_data",
    # Read only to check NVDA's message (protocol.py).
    "hz", "paused",
    # ctypes struct fields, read by Windows (winapi.py).
    "LimitFlags", "cbSize", "lpfnWndProc", "hInstance", "lpszClassName", "hWnd", "uID", "uFlags",
    "uCallbackMessage", "hIcon", "szTip", "uVersion",
    # Tests post the messages Windows would send (winapi.py).
    "post",
]

# ---------------------------------------------------------------- deptry

[tool.deptry]
known_first_party = ["agent_speech_check"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage and its 90% floor live in the `test` poe task, so `pytest -m e2e`
# (a small subset of the code) is not failed by the floor.
addopts = ["--strict-markers"]
pythonpath = ["."]
markers = ["e2e: needs a real portable NVDA (Windows Sandbox or the e2e CI workflow)"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["agent_speech_check"]
# Measure the real `asc` subprocesses the integration tests start.
patch = ["subprocess"]
parallel = true

# ---------------------------------------------------------------- codespell

[tool.codespell]
skip = "./.git,./.venv,./uv.lock,./build,./dist,*.html"
# fo: the tasklist /fo flag. caf: the start of "Café" in a Unicode test.
ignore-words-list = "fo,caf"
