[project]
name = "agent-speech-check"
version = "0.0.1"
description = "Let AI agents test your app with a real NVDA: press keys, read what NVDA says, check it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nibarAhmed" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Adaptive Technologies",
]
dependencies = []

[project.scripts]
asc = "agent_speech_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_speech_check"]

[dependency-groups]
dev = [
    "codespell",
    "deptry",
    "mypy",
    "poethepoet",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "trustme",
    "vulture",
]

# ---------------------------------------------------------------- tasks

[tool.poe.tasks]
dashes = "python scripts/check_dashes.py"
spell = "codespell"
fmt-check = "ruff format --check ."
lint = "ruff check ."
types = "mypy"
dead = "vulture"
deps = "deptry src"
test = "pytest -m 'not e2e' --cov=agent_speech_check --cov-report=term-missing:skip-covered --cov-fail-under=90"
check = ["dashes", "spell", "fmt-check", "lint", "types", "dead", "deps", "test"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/planning"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "BLE", "UP", "SIM", "C4", "PT", "RUF", "ASYNC",
    "PTH", "PL", "TRY", "ARG", "ERA", "S", "T20",
]

[tool.ruff.lint.per-file-ignores]
# cli.py is the only module allowed to print.
"src/agent_speech_check/cli.py" = ["T20"]
"tests/**" = ["S101", "PLR2004"]
# Throwaway M0 spike: prints results and drives subprocesses on purpose.
"scripts/spike_remote.py" = ["T20", "S603", "S607", "PLR0915", "PLR2004", "BLE001"]
"scripts/check_dashes.py" = ["T20", "S603", "S607"]
".claude/hooks/*.py" = ["T20", "S603", "S607"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
strict = true
files = ["src", "tests", "scripts/check_dashes.py", ".claude/hooks"]
mypy_path = "src"

# ---------------------------------------------------------------- vulture

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 80

# ---------------------------------------------------------------- deptry

[tool.deptry]
known_first_party = ["agent_speech_check"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage and its 90% floor live in the `test` poe task, so `pytest -m e2e`
# (a small subset of the code) is not failed by the floor.
addopts = ["--strict-markers"]
markers = ["e2e: needs a real portable NVDA (manual or nightly)"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["agent_speech_check"]
# Measure the real `asc` subprocesses the integration tests start.
patch = ["subprocess"]
parallel = true

# ---------------------------------------------------------------- codespell

[tool.codespell]
skip = "./.git,./.venv,./uv.lock,./docs/planning,./build,./dist,*.html"
